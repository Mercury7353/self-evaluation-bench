[project]
name = "self-evaluation-bench"
version = "0.1.0"
description = "Evaluate benchmark-designing researchers with metered execution and independent acceptance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1", "scipy==1.18.1", "pyyaml==6.0.3", "numpy==2.5.2"]
[project.optional-dependencies]
dev = ["pytest==9.1.1"]
agent = ["harbor==0.22.0"]
[project.scripts]
seb = "seb.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["seb"]
